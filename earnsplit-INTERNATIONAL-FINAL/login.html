<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js')
      .then(reg => console.log('SW registered - EarnSplit PWA ready'))
      .catch(err => console.log('SW failed', err));
  });
}
</script>
